#
# The documentation site: built from docs/ by Zensical and published to
# GitHub Pages by .github/workflows/docs.yml. How to build and preview
# it, and why Zensical: docs/workflow/documentation-site.md.
site_name: SMUniversal Lab Suite
site_description: >-
  Modular SMU measurement applications - bench guides and developer notes
site_url: https://jcgutierrezg.github.io/SMUniversal_Lab_Suite/
repo_url: https://github.com/jcgutierrezg/SMUniversal_Lab_Suite
repo_name: SMUniversal_Lab_Suite
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/app_icon.png
  favicon: assets/app_icon.png
  # The windows' faces ship with Windows and are named in
  # assets/app-theme.css; a web font would be a download for no gain.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  # Light is the lab notebook, dark is the instrument front panel - the
  # windows' two modes (docs/architecture/theme.md). Colours are set in
  # assets/app-theme.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Front panel (dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Lab notebook (light)

extra_css:
  - assets/app-theme.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

