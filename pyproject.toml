# Packaging decisions and their reasoning: docs/workflow/packaging.md.
# The layout is flat (`core/`, `devices/`, `drivers/`, `experiments/` at
# the top level) rather than under `src/`, and that note says why.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smuniversal-lab-suite"
version = "0.1.0"
description = "SMUniversal Lab Suite - modular SMU measurement applications"
# The floor states what is supported *and tested*, not what might work.
# It must agree with `.python-version` and the CI matrix, and
# `tests/test_python_floor.py` fails if the three drift apart. Raising
# it means adding the version to the matrix first - see
# docs/faults/18-accidental-accuracy.md.
requires-python = ">=3.14"
dependencies = [
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",   # pure-python VISA backend, used alongside any vendor one
    # The temperature stage is a plain serial device rather than a VISA
    # instrument, so pyserial is reachable from every window.
    "pyserial>=3.5",
    # Mandatory, deliberately: every experiment window builds a
    # Matplotlib canvas, the 4PP corrections are SciPy, and the geometry
    # panel is Pillow. Splitting them would turn the common case into a
    # two-step install for no deployment anyone has asked for.
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",      # 4PP correction tables: CubicSpline + griddata
    "pillow>=10.0",     # scales the W/L diagram in the 4PP geometry panel
]

[project.optional-dependencies]
# What may move out of the mandatory set is decided by what the *code*
# does when the package is absent. Each extra below has a named failure
# message and a test that provokes it: tests/test_optional_extras.py.
# An extra that turns a missing package into an opaque ImportError at
# the moment an operator picks an instrument is worse than shipping it
# to everybody.

# `MiniSMUTransport.connect()` imports the vendor library and raises a
# RuntimeError naming this extra, so a machine without it loses that one
# instrument and nothing else.
minismu = [
    "minismu-py>=0.4.0",   # 0.4.0 fixed CSV sweep retrieval and polling
]

# pyvisa-py can only see USB instruments with a USB layer under it.
# Without these, "@py" finds no USB devices at all - which looks exactly
# like an unplugged cable. `VisaTransport.scan_summary()` therefore says
# so on the "@py" line rather than reporting an empty scan.
# libusb-package ships the libusb binary, which saves a manual DLL
# install on Windows.
usb = [
    "pyusb>=1.2",
    "libusb-package>=1.0",
]

# 0.1.0 is pinned exactly because the transport uses the driver's
# private timeout fields to preserve `Transport._read(timeout_s)`. A
# future upstream release must be re-checked before this pin moves.
# It carries `usb` rather than assuming it, so selecting this transport
# without the USB layer fails at the thing that is actually missing.
direct-gpib = [
    "smuniversal-lab-suite[usb]",
    "ni-gpib-usb-hs==0.1.0",
]

# What a bench machine installs, and what CI installs. It does not pull
# `direct-gpib`: that needs one specific adapter and pins a vendor
# driver by exact version, so folding it in would broaden the default.
bench = [
    "smuniversal-lab-suite[minismu,usb]",
]

[project.scripts]
# Names `core.launcher`, not `main`: a console script entry point must
# be importable, and installing a top-level module called `main` into
# site-packages puts it in a namespace every other package also wants.
smu-lab-suite = "core.launcher:main"

[dependency-groups]
# Installed automatically by `uv sync`.
dev = [
    "pytest>=8.0",
    # Property-based tests over the shared validators: they generate the
    # cases nobody thought of and shrink a failure to its smallest
    # reproducing input.
    "hypothesis>=6.100",
    # The floor is the version the rule set below was made green
    # against; `uv.lock` fixes the actual version and CI installs with
    # `--locked`. That distinction matters for a linter: a new release
    # can add rules to a prefix-selected group, so an unlocked upgrade
    # would turn the gate red for a reason nobody changed.
    "ruff>=0.16.5",
    # Boundary type checking only - see [tool.mypy].
    "mypy>=1.11",
]

[tool.ruff]
# The criterion for a rule being in `select` is not "is it a good idea"
# but **"is it green on this tree today"**, because only a green gate
# can be required to stay green. Rules that are valuable and currently
# noisy are listed with their counts in docs/open/technical-debt.md.
line-length = 79
target-version = "py314"
extend-exclude = [".venv", "tests/golden"]

[tool.ruff.lint]
select = [
    # E9 is "ruff could not parse or read this file"; F is pyflakes.
    # These are the findings that are wrong rather than untidy.
    "E9",
    "F",
    # Import order: the one purely mechanical rule whose fix is total,
    # so it keeps `F401` diffs small.
    "I",
    # Comparison mistakes that read as correct: `== None`, `== True`,
    # `not x in y`, `type(a) == type(b)`.
    "E711", "E712", "E713", "E714", "E721",
    # `except:` with no class, which also swallows KeyboardInterrupt and
    # SystemExit. Zero of these today, and house rule 13 keeps it so.
    "E722",
    # bugbear: mutable default arguments, a loop variable captured by a
    # closure defined in the loop, `assert` on a tuple, exceptions
    # raised inside `except` without a cause.
    "B",
    # bandit. This project handles no credentials and serves no network,
    # so most of it never fires - which is the point. It is here for
    # `eval`, a pickle load, `verify=False`, or `shell=True`.
    "S",
    # Pylint's *error* category only: things that raise at runtime.
    "PLE",
    # A `breakpoint()` or `pdb.set_trace()` left in the tree.
    "T10",
]

ignore = [
    # Deferred with a reason and a count in docs/open/technical-debt.md.
    "B905",             # zip() without strict=
    "S110", "S112",     # try/except/pass and try/except/continue
    # B007 (5): an unused loop variable. Cosmetic.
    "B007",
    # S101 (539): `assert`, every one in a test. Ignored globally rather
    # than per-file because conftest.py, the harnesses under tests/ and
    # the golden builders all legitimately assert too.
    "S101",
    # S603/S607: every call site runs `git` or this interpreter, from
    # the test suite and the doc builder, with arguments this repository
    # wrote. There is no untrusted input anywhere near them.
    "S603", "S607",
    # S105: all three "hardcoded passwords" are SCPI range *tokens*.
    # The vocabulary clash is permanent and this project has no
    # credentials of any kind.
    "S105",
]

[tool.ruff.lint.per-file-ignores]
# S108: a `/tmp/example` storage-path fixture. S311: `random` in a
# physics test. Neither is security-relevant.
"tests/*" = ["S108", "S311"]
# The suite deliberately provokes exceptions to prove a guard fires.
# Where the point is "anything at all is refused", narrowing the class
# would weaken the assertion.
"tests/test_calculation.py" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["core", "devices", "drivers", "experiments",
                     "probes", "tools"]

[tool.mypy]
# Type checking **at the boundaries**, not the repository. The contracts
# between a driver, a transport and a run are small, stable, and the
# place a wrong shape costs a measurement; a whole-repo adoption of a
# Tkinter application produces thousands of findings about widget
# attributes and lands nowhere.
#
# `uv run mypy` with no arguments checks exactly this list, so CI and a
# developer run the same surface without either having to remember it.
files = [
    "core/transports/base.py",    # the transport protocol
    "drivers/base_smu.py",        # the driver contract
    "core/run_control.py",        # run context and shutdown reports
    "core/parameters.py",         # the frozen parameter snapshots
    "core/ranges.py",             # the ranging plan handed to a driver
    "core/limits.py",             # the per-model envelope
    "core/readback.py",           # the five-state readback answer
]
python_version = "3.14"
# Instrument libraries ship no stubs, and writing stubs for pyvisa to
# type-check this project's own contracts would be the tail wagging the
# dog.
ignore_missing_imports = true
# Checked for internal consistency, not annotation coverage: demanding a
# signature on everything is how incremental adoptions stop.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# "silent" still follows imports for type information and reports only
# on the files named above. Without it, checking `core/run_control.py`
# would drag in every driver and Tk panel behind it.
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns an unregistered marker into a collection error.
# Without it a marker typo fails *open*: get_closest_marker() returns
# None for a name pytest has never heard of, so `instrument_discovery`
# misspelled in conftest.py would silently stub the one file that must
# not be stubbed, and the suite would go on passing while testing
# something else.
#
# -ra prints a reason for every non-passing test, which matters because
# the suite is mostly integration-shaped.
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than ~5 s; excluded from the default suite",
    "gui: builds a real Tk window (needs a display, or Xvfb on CI)",
    "hardware: needs a physical instrument; never run in CI",
    "timing: asserts an upper bound on elapsed wall-clock time; run serially, never beside another group",
    "instrument_discovery: exercises transport scanning; opts out of the conftest stub that stops tests reaching the network",
]

[tool.uv]
# Prefer an interpreter already on the machine over a uv-managed one.
# Every Windows TclError this project has seen came from a uv-managed
# interpreter under AppData\\Roaming; the reasoning is in
# docs/workflow/delivering-work.md. "system" rather than "only-system"
# so a machine with no suitable interpreter still gets one instead of
# failing to set up at all.
python-preference = "system"


[tool.hatch.build.targets.wheel]
# Listed rather than auto-discovered: a guess that silently drops a
# package produces an application that imports and then fails at the
# first driver lookup. `tests/test_packaging.py` checks this list
# against the packages actually in the tree.
packages = ["core", "devices", "drivers", "experiments"]

[tool.hatch.build.targets.wheel.force-include]
# The launcher is a module, not a package, so the `packages` list above
# does not sweep it up.
"main.py" = "main.py"

[tool.hatch.build]
# No include rule for the assets, deliberately. Hatchling includes every
# tracked file inside a declared package whatever its extension, so a
# future `.svg` or `.ico` is covered without editing this file. An
# earlier `artifacts` key here did nothing at all; see
# docs/workflow/packaging.md. `tests/test_build_artifact.py` inspects a
# built wheel rather than reading this file, for that reason.
#
# The realistic ways to break asset inclusion are adding an `exclude` or
# `only-include` rule here, or dropping a package from the list above.

[tool.hatch.build.targets.wheel.sources]
# Flat layout: the packages are already at the root, so no path
# rewriting is wanted. Stated explicitly because hatchling's default
# guess changes with layout.
"" = ""
