# Why each choice here is what it is: docs/workflow/delivering-work.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # One cell, not the matrix: neither ruff nor mypy reads the
    # operating system, and a finding repeated four times is still one
    # finding.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra bench --python python
      - name: Lint
        run: uv run ruff check .
      - name: Types at the boundaries
        run: uv run mypy

  # The dependency audit is scheduled rather than run here; see
  # .github/workflows/dependency-audit.yml for why it does not block.

  test:
    # Windows is the deployment platform and finds defects Linux
    # structurally cannot. Ubuntu is fast and catches path-separator and
    # case-sensitivity mistakes. One Python version, and it is the one
    # every machine runs; a newer one is added here first and has to go
    # green before requires-python and .python-version move.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14"]

    runs-on: ${{ matrix.os }}

    # A liveness bound, not a performance target. Reaching it means
    # something stopped, and the log names what; without it a hung job
    # runs to the platform default of six hours and reports a
    # cancellation that says nothing.
    timeout-minutes: 25

    # print() to a pipe is block-buffered and a whole run's output fits
    # in one buffer, so without this a step that never exits produces a
    # completely empty log.
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      # fetch-depth: 0, not the default 1. tests/test_docs.py compares
      # each driver against `git log -1 -- <driver>`, and on a shallow
      # clone that reports HEAD for every tracked file. The test skips
      # itself rather than lying when history is truncated; this is what
      # stops it skipping in the one place it must run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # python.org / actions builds, NOT uv's managed distribution.
      # Isolating the interpreter source is the point of this step.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install a display and Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Check tkinter before anything else
        # A bare smoke test, so a broken Tcl/Tk shows up as its own
        # failing step rather than as a puzzling test failure later.
        # Create/destroy/create is exercised because that sequence was
        # once suspected; it passes on Windows.
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          python -c "import tkinter; r=tkinter.Tk(); r.withdraw(); print(tkinter.TkVersion); r.destroy(); r2=tkinter.Tk(); r2.destroy(); print('second interpreter ok')"

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml, so a
        # dependency change that was never locked cannot merge. --extra
        # bench is the environment a bench machine has; the absent case
        # is tested in-process by tests/test_optional_extras.py.
        run: uv sync --locked --extra bench --python python

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run python run_tests.py --all --jobs 1

      - name: Run tests (Linux)
        # Tk needs a display; xvfb-run supplies a virtual one.
        run: xvfb-run -a uv run python run_tests.py --all --jobs 1
        if: runner.os == 'Linux'
