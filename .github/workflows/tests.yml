name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is the platform this actually runs on, so it is not
    # optional here. Wave 0a found two defects that Linux structurally
    # cannot reproduce: time.monotonic() resolving to 15.6 ms, and a Tcl
    # runtime that fails once too many Tk interpreters have been built in
    # one process. Ubuntu is kept because it is fast and catches
    # path-separator and case-sensitivity mistakes.
    #
    # 3.14 is included to find out whether the move is safe before it is
    # made on the bench machine, which is the sort of question CI should
    # answer rather than an evening at the instrument rack.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # python.org / actions builds, NOT uv's managed distribution.
      # Every Windows TclError so far has come from a uv-managed
      # interpreter under AppData\Roaming, reporting that Tcl files it
      # can see are unreadable - with errno 0, which is what a
      # filesystem filter driver returns, not what a missing file
      # returns. Isolating the interpreter source is the point of this
      # step; if Windows goes green here, the distribution was the fault.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install a display and Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Check tkinter before anything else
        # A bare smoke test, so a broken Tcl/Tk shows up as its own
        # failing step rather than as a puzzling test failure later.
        # Passed on Windows, which is how we know create/destroy/create
        # is not the trigger on its own.
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          python -c "import tkinter; r=tkinter.Tk(); r.withdraw(); print(tkinter.TkVersion); r.destroy(); r2=tkinter.Tk(); r2.destroy(); print('second interpreter ok')"

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml, so a
        # dependency change that was never locked cannot merge.
        run: uv sync --locked --python python

      - name: Diagnose Tk teardown
        # Temporary. Bisects what finalises Tcl; delete once answered.
        continue-on-error: true
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          uv run python tools/diagnose_tk.py

      - name: Capture-mode experiment (Windows)
        # Every ingredient the diagnostic tried passes on Windows, so the
        # trigger is pytest itself rather than anything the tests import.
        # pytest's default capture replaces fds 1 and 2 at the OS level;
        # Tcl reads its .tcl files through the C runtime, and an errno of
        # 0 on a readable file fits a handle problem. This runs one file
        # that reliably fails, three ways:
        #   fd   - the default, replaces the file descriptors
        #   sys  - replaces sys.stdout/stderr only, leaves fds alone
        #   no   - -s, no capture at all
        # Whichever modes pass tell us whether capture is the cause.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          uv run pytest tests/test_dialects.py -q --capture=fd
          Write-Host "== capture=fd exit $LASTEXITCODE =="
          uv run pytest tests/test_dialects.py -q --capture=sys
          Write-Host "== capture=sys exit $LASTEXITCODE =="
          uv run pytest tests/test_dialects.py -q -s
          Write-Host "== no capture exit $LASTEXITCODE =="

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run python run_tests.py --all

      - name: Run tests (Linux)
        # Tk needs a display; xvfb-run supplies a virtual one.
        run: xvfb-run -a uv run python run_tests.py --all
        if: runner.os == 'Linux'
