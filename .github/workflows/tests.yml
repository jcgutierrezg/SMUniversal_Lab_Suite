name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # Lint and boundary types. One cell, not the matrix: neither reads
    # the operating system, and a finding repeated four times is still
    # one finding. The rule set is narrow enough to be green on this
    # tree today, which is the only thing that makes it a gate rather
    # than a permanently red job - see the reasoning in pyproject.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra bench --python python
      - name: Lint
        run: uv run ruff check .
      - name: Types at the boundaries
        run: uv run mypy

  # The dependency audit is scheduled rather than run here; see
  # .github/workflows/dependency-audit.yml for why it does not block.

  test:
    # Windows is the platform this actually runs on, so it is not
    # optional here. Wave 0a found two defects that Linux structurally
    # cannot reproduce: time.monotonic() resolving to 15.6 ms, and a Tcl
    # runtime that fails once too many Tk interpreters have been built in
    # one process. Ubuntu is kept because it is fast and catches
    # path-separator and case-sensitivity mistakes.
    #
    # One Python version, and it is the one every machine runs. Carrying
    # a second that nothing is deployed on produces red cells nobody can
    # act on, and a red cell nobody acts on is how "a red run gets
    # diagnosed, not re-run" stops being true.
    #
    # When a newer Python is being evaluated, add it here first and let
    # it go green before moving requires-python and .python-version.
    # That is how 3.14 arrived, and 3.12 left once the fleet was on 3.14.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14"]

    runs-on: ${{ matrix.os }}

    # Without this a hung job runs to the platform default of six hours
    # and then reports a cancellation, which says nothing about what
    # hung. The suite's slowest observed run is well under ten minutes,
    # so this is a liveness bound and not a performance target: reaching
    # it means something stopped, and the log now names what.
    timeout-minutes: 25

    # print() to a pipe is block-buffered, and a whole run's output fits
    # inside one buffer. Without this a step that never exits produces a
    # completely empty log.
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      # fetch-depth: 0, not the default 1. tests/test_docs.py derives
      # each driver's commissioning status by comparing its note's
      # last_bench date against `git log -1 -- <driver>`. On a shallow
      # clone that query reports HEAD for every tracked file, so the
      # whole fleet would read as stale for a reason that has nothing to
      # do with the fleet. The test skips itself rather than lying when
      # history is truncated; this is what stops it skipping in CI,
      # which is the one place it must actually run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # python.org / actions builds, NOT uv's managed distribution.
      # Every Windows TclError so far has come from a uv-managed
      # interpreter under AppData\Roaming, reporting that Tcl files it
      # can see are unreadable - with errno 0, which is what a
      # filesystem filter driver returns, not what a missing file
      # returns. Isolating the interpreter source is the point of this
      # step; if Windows goes green here, the distribution was the fault.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install a display and Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Check tkinter before anything else
        # A bare smoke test, so a broken Tcl/Tk shows up as its own
        # failing step rather than as a puzzling test failure later.
        # Passed on Windows, which is how we know create/destroy/create
        # is not the trigger on its own.
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          python -c "import tkinter; r=tkinter.Tk(); r.withdraw(); print(tkinter.TkVersion); r.destroy(); r2=tkinter.Tk(); r2.destroy(); print('second interpreter ok')"

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml, so a
        # dependency change that was never locked cannot merge.
        #
        # --extra bench is the environment a bench machine has, after
        # A-11 made the miniSMU library and the USB layer optional. The
        # absent case is tested in-process by tests/test_optional_extras.py
        # rather than by a second matrix cell.
        run: uv sync --locked --extra bench --python python

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run python run_tests.py --all

      - name: Run tests (Linux)
        # Tk needs a display; xvfb-run supplies a virtual one.
        run: xvfb-run -a uv run python run_tests.py --all
        if: runner.os == 'Linux'
